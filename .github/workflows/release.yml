# audio.cpp - release.yml
#
# CPU and Vulkan binary/library packages use dynamically selected CPU variants.
#
# Semantic-version, tag-driven releases. The workflow runs when a `v*` (semver)
# tag is pushed (drafting a Release and Publishing it) or when run manually
# from the Actions UI with an explicit version. Publishing attaches the built
# binaries to that version's GitHub Release. There is NO auto-release on every
# push to `main`.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release, e.g. 1.2.0 or v1.2.0 (used for manual runs; tag-triggered runs use the pushed tag).'
        required: true
        default: ''
        type: string
      publish:
        description: 'Publish a GitHub Release after the build. Leave unchecked for a build-only dry run.'
        required: false
        default: false
        type: boolean
      source_repository:
        description: 'Optional source repository; defaults to this repository.'
        required: false
        default: ''
        type: string
      source_ref:
        description: 'Optional source revision; defaults to the workflow revision.'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

env:
  GH_TOKEN: ${{ github.token }}
  BUILD_TARGETS: audiocpp_cli audiocpp_server audiocpp_gguf
  VULKAN_VERSION: '1.4.357.0'
  CMAKE_ARGS: "-DAUDIOCPP_DEPLOYMENT_BUILD=ON -DAUDIOCPP_BUILD_NATIVE_MODEL_MANAGER=ON -DENGINE_ENABLE_LLAMAFILE=ON -DENGINE_ENABLE_CUDA_GRAPHS=ON"

# note: run this workflow one at a time for better cache reuse
concurrency:
  group: release
  queue: max

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      # The only triggers are a manually-run workflow or a pushed `v*` tag -
      # both are intentional, so always proceed.
      - id: check
        run: echo "should_release=true" >> "$GITHUB_OUTPUT"

  get-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.source.outputs.sha }}
    needs: check-release
    if: ${{ needs.check-release.outputs.should_release == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Resolve source revision
        id: source
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository || github.repository }}
          PUBLISH: ${{ github.ref_type == 'tag' || inputs.publish }}
        run: |
          if [[ "$PUBLISH" == true && "$SOURCE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Publish from the source repository, not a separate workflow repository."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve release tag
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            TAG="${{ inputs.version }}"
          else
            echo "::error::No semver tag or version provided (push a v* tag, or run manually with a version)."
            exit 1
          fi
          [[ "$TAG" == v* ]] || TAG="v${TAG}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  server-config-examples:
    name: Server config examples
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ needs.get-version.outputs.source_sha }}
      - name: Package server config examples
        env:
          TAG: ${{ needs.get-version.outputs.tag }}
        run: zip -qr "audio-${TAG}-server-config-examples.zip" LICENSE examples/server
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ needs.get-version.outputs.tag }}-server-config-examples
          path: audio-${{ needs.get-version.outputs.tag }}-server-config-examples.zip
          if-no-files-found: error

  linux-cpu:
    name: Ubuntu x64 (CPU)
    needs: [check-release, get-version]
    if: ${{ needs.check-release.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ needs.get-version.outputs.source_sha }}
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake make glslc libvulkan-dev spirv-headers
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DENGINE_ENABLE_CUDA=OFF -DENGINE_ENABLE_VULKAN=OFF \
            -DENGINE_ENABLE_CPU_ALL_VARIANTS=ON \
            -DAUDIOCPP_VERSION=${{ needs.get-version.outputs.version }} \
            ${{ env.CMAKE_ARGS }}
      - name: Build
        run: cmake --build build --config Release --parallel "$(nproc)" --target ${{ env.BUILD_TARGETS }}
      - name: Stage bundle
        run: |
          cp LICENSE build/bin/ 2>/dev/null || true
          cp -r tools build/bin/tools 2>/dev/null || true
          cp -r model_specs build/bin/model_specs 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ needs.get-version.outputs.tag }}-bin-ubuntu-x64-cpu
          path: build/bin/*
      - name: Build and stage C API library
        run: |
          cmake -S . -B build -DAUDIOCPP_BUILD_C_API=ON
          cmake --build build --parallel "$(nproc)" --target audiocpp
          mkdir -p dist-lib/libs dist-lib/include
          cp include/audiocpp.h dist-lib/include/
          cp LICENSE dist-lib/
          find build/bin -maxdepth 1 \( -name '*.so*' -o -name '*.dylib' \) -exec cp -P {} dist-lib/libs/ \;
          mv build/bin/libaudiocpp* dist-lib/libs/
          tar -czf audio-${{ needs.get-version.outputs.tag }}-lib-ubuntu-x64-cpu.tar.gz -C dist-lib .
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ needs.get-version.outputs.tag }}-lib-ubuntu-x64-cpu
          path: audio-${{ needs.get-version.outputs.tag }}-lib-ubuntu-x64-cpu.tar.gz


  linux-vulkan:
    name: Ubuntu x64 (Vulkan)
    needs: [check-release, get-version]
    if: ${{ needs.check-release.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ needs.get-version.outputs.source_sha }}
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake make glslc libvulkan-dev spirv-headers
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DENGINE_ENABLE_CUDA=OFF -DENGINE_ENABLE_VULKAN=ON \
            -DENGINE_ENABLE_CPU_ALL_VARIANTS=ON \
            -DAUDIOCPP_VERSION=${{ needs.get-version.outputs.version }} \
            ${{ env.CMAKE_ARGS }}
      - name: Build
        run: cmake --build build --config Release --parallel "$(nproc)" --target ${{ env.BUILD_TARGETS }}
      - name: Stage bundle
        run: |
          cp LICENSE build/bin/ 2>/dev/null || true
          cp -r tools build/bin/tools 2>/dev/null || true
          cp -r model_specs build/bin/model_specs 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ needs.get-version.outputs.tag }}-bin-ubuntu-x64-vulkan
          path: build/bin/*
      - name: Build and stage C API library
        run: |
          cmake -S . -B build -DAUDIOCPP_BUILD_C_API=ON
          cmake --build build --parallel "$(nproc)" --target audiocpp
          mkdir -p dist-lib/libs dist-lib/include
          cp include/audiocpp.h dist-lib/include/
          cp LICENSE dist-lib/
          find build/bin -maxdepth 1 \( -name '*.so*' -o -name '*.dylib' \) -exec cp -P {} dist-lib/libs/ \;
          mv build/bin/libaudiocpp* dist-lib/libs/
          tar -czf audio-${{ needs.get-version.outputs.tag }}-lib-ubuntu-x64-vulkan.tar.gz -C dist-lib .
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ needs.get-version.outputs.tag }}-lib-ubuntu-x64-vulkan
          path: audio-${{ needs.get-version.outputs.tag }}-lib-ubuntu-x64-vulkan.tar.gz


  windows-cpu:
    name: Windows x64 (CPU)
    needs: [check-release, get-version]
    if: ${{ needs.check-release.outputs.should_release == 'true' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ needs.get-version.outputs.source_sha }}
      - name: Build
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1 -Preset windows-cpu-release -ConfigureOnly -DeploymentBuild -NativeModelManager -Version ${{ needs.get-version.outputs.version }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S . -B build/windows-cpu-release -DENGINE_ENABLE_CPU_ALL_VARIANTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows-cpu-release --config Release --parallel $env:NUMBER_OF_PROCESSORS --target ($env:BUILD_TARGETS -split ' ')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle VC runtime
        shell: pwsh
        working-directory: build/windows-cpu-release/bin
        # App-local deployment of the MSVC runtime so the prebuilt binaries run
        # on clean Windows without a separately installed VC++ Redistributable.
        # Sizes: vcruntime140* + msvcp140* + vcomp140 ~2 MB (well under 1 MB
        # compressed), negligible against the CPU/Vulkan/CUDA zip sizes.
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Sort-Object { try { [version]$_.Name } catch { [version]'0.0' } } -Descending |
            Select-Object -First 1
          foreach ($sub in 'x64\Microsoft.VC143.CRT', 'x64\Microsoft.VC143.OPENMP') {
            $dir = Join-Path $redist.FullName $sub
            if (Test-Path $dir) {
              Get-ChildItem "$dir\*.dll" | Where-Object {
                $_.Name -match '^(vcruntime140|msvcp140|vcomp140)'
              } | Copy-Item -Destination . -ErrorAction SilentlyContinue
            }
          }
          Get-ChildItem *.dll | Select-Object Name | Out-String | Write-Host
      - name: Stage bundle
        shell: pwsh
        working-directory: build/windows-cpu-release/bin
        run: |
          cp ..\..\..\LICENSE . 2>$null
          Copy-Item -Recurse ..\..\..\tools .\tools -ErrorAction SilentlyContinue
          Copy-Item -Recurse ..\..\..\model_specs .\model_specs -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ needs.get-version.outputs.tag }}-bin-windows-x64-cpu
          path: build/windows-cpu-release/bin/*
      - name: Build and stage C API library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake -S . -B build/windows-cpu-release -DAUDIOCPP_BUILD_C_API=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows-cpu-release --config Release --parallel $env:NUMBER_OF_PROCESSORS --target audiocpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist-lib/libs, dist-lib/include | Out-Null
          Copy-Item include/audiocpp.h dist-lib/include/
          Copy-Item LICENSE dist-lib/
          Copy-Item build/windows-cpu-release/bin/*.dll dist-lib/libs/
          Move-Item build/windows-cpu-release/bin/audiocpp.* dist-lib/libs/ -Force
          Compress-Archive -Path dist-lib/* -DestinationPath audio-${{ needs.get-version.outputs.tag }}-lib-windows-x64-cpu.zip
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ needs.get-version.outputs.tag }}-lib-windows-x64-cpu
          path: audio-${{ needs.get-version.outputs.tag }}-lib-windows-x64-cpu.zip


  windows-vulkan:
    name: Windows x64 (Vulkan)
    needs: [check-release, get-version]
    if: ${{ needs.check-release.outputs.should_release == 'true' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ needs.get-version.outputs.source_sha }}
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\\VulkanSDK\\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\\VulkanSDK\\${env:VULKAN_VERSION}\\bin"
      - name: Build
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1 -Preset windows-vulkan-release -ConfigureOnly -DeploymentBuild -NativeModelManager -Version ${{ needs.get-version.outputs.version }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S . -B build/windows-vulkan-release -DENGINE_ENABLE_CPU_ALL_VARIANTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows-vulkan-release --config Release --parallel $env:NUMBER_OF_PROCESSORS --target ($env:BUILD_TARGETS -split ' ')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle VC runtime
        shell: pwsh
        working-directory: build/windows-vulkan-release/bin
        # App-local deployment of the MSVC runtime (see windows-cpu comments).
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Sort-Object { try { [version]$_.Name } catch { [version]'0.0' } } -Descending |
            Select-Object -First 1
          foreach ($sub in 'x64\Microsoft.VC143.CRT', 'x64\Microsoft.VC143.OPENMP') {
            $dir = Join-Path $redist.FullName $sub
            if (Test-Path $dir) {
              Get-ChildItem "$dir\*.dll" | Where-Object {
                $_.Name -match '^(vcruntime140|msvcp140|vcomp140)'
              } | Copy-Item -Destination . -ErrorAction SilentlyContinue
            }
          }
          Get-ChildItem *.dll | Select-Object Name | Out-String | Write-Host
      - name: Stage bundle
        shell: pwsh
        working-directory: build/windows-vulkan-release/bin
        run: |
          cp ..\..\..\LICENSE . 2>$null
          Copy-Item -Recurse ..\..\..\tools .\tools -ErrorAction SilentlyContinue
          Copy-Item -Recurse ..\..\..\model_specs .\model_specs -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ needs.get-version.outputs.tag }}-bin-windows-x64-vulkan
          path: build/windows-vulkan-release/bin/*
      - name: Build and stage C API library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake -S . -B build/windows-vulkan-release -DAUDIOCPP_BUILD_C_API=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows-vulkan-release --config Release --parallel $env:NUMBER_OF_PROCESSORS --target audiocpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist-lib/libs, dist-lib/include | Out-Null
          Copy-Item include/audiocpp.h dist-lib/include/
          Copy-Item LICENSE dist-lib/
          Copy-Item build/windows-vulkan-release/bin/*.dll dist-lib/libs/
          Move-Item build/windows-vulkan-release/bin/audiocpp.* dist-lib/libs/ -Force
          Compress-Archive -Path dist-lib/* -DestinationPath audio-${{ needs.get-version.outputs.tag }}-lib-windows-x64-vulkan.zip
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ needs.get-version.outputs.tag }}-lib-windows-x64-vulkan
          path: audio-${{ needs.get-version.outputs.tag }}-lib-windows-x64-vulkan.zip


  release:
    name: Create release
    needs:
      - check-release
      - get-version
      - server-config-examples
      - linux-cpu
      - linux-vulkan
      - windows-cpu
      - windows-vulkan
    if: >-
      ${{
        always() &&
        needs.check-release.outputs.should_release == 'true' &&
        (github.ref_type == 'tag' || inputs.publish) &&
        needs.get-version.result == 'success' &&
        needs.server-config-examples.result == 'success' &&
        needs.linux-cpu.result == 'success' &&
        needs.linux-vulkan.result == 'success' &&
        needs.windows-cpu.result == 'success' &&
        needs.windows-vulkan.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ needs.get-version.outputs.source_sha }}
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      # Each artifact downloads into release-assets/<artifact-name>/ holding the raw
      # bundle (binaries + tools/ + model_specs/). Archive per platform here so
      # the release ships the same zip/tar.gz layout as before; artifact names
      # already match the final asset basenames.
      - name: Create release archives
        run: |
          set -euo pipefail
          if ! command -v zip >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y zip
          fi
          cd release-assets
          for d in */; do
            name="${d%/}"
            echo "Packing ${name}"
            case "$name" in
              *-lib-*|*-cudart-ubuntu-*|*-server-config-examples)
                mv "$d"* .
                ;;
              *windows*)
                (cd "$d" && zip -qqr "../${name}.zip" .)
                ;;
              *)
                # upload-artifact drops file modes; restore the executable bit
                chmod +x "$d"audiocpp_*
                (cd "$d" && tar -czf "../${name}.tar.gz" .)
                ;;
            esac
          done
          rm -rf -- */
          ls -la
      - name: Create and push git tag
        run: |
          TAG="${{ needs.get-version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping creation"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
      - name: Check for existing release
        id: relstate
        run: |
          TAG="${{ needs.get-version.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # Existing release (e.g. one the maintainer drafted and published):
      # attach the built binaries only, preserving its pre-release flag and
      # hand-written notes. --clobber allows rebuilding the same version.
      - name: Upload binaries to existing release
        if: ${{ steps.relstate.outputs.exists == 'true' }}
        run: |
          gh release upload "${{ needs.get-version.outputs.tag }}" release-assets/*.zip release-assets/*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
      # Newly-created tag with no release yet: create the release w/ notes.
      - name: Create release
        if: ${{ steps.relstate.outputs.exists != 'true' }}
        run: |
          gh release create "${{ needs.get-version.outputs.tag }}" release-assets/*.zip release-assets/*.tar.gz --title "${{ needs.get-version.outputs.tag }}" --generate-notes --repo "$GITHUB_REPOSITORY"
